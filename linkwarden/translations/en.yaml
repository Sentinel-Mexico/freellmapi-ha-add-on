configuration:
  nextauth_secret:
    name: Auth Secret
    description: >-
      Secret key used for session encryption and authentication tokens. Leave
      empty to auto-generate and persist one. Only set this if you are
      migrating from an existing Linkwarden instance.
  registration_enabled:
    name: Allow Registration
    description: >-
      Allow new users to create accounts. Disable this after you have
      created all the accounts you need.
  log_level:
    name: Log Level
    description: >-
      Server log verbosity. Use "debug" when troubleshooting.
  smtp_host:
    name: SMTP Host
    description: >-
      SMTP server hostname for sending emails (password resets, invitations).
      Leave empty to disable email features.
  smtp_port:
    name: SMTP Port
    description: >-
      SMTP server port. Common values: 587 (STARTTLS), 465 (TLS), 25 (plain).
  smtp_username:
    name: SMTP Username
    description: Username for SMTP authentication.
  smtp_password:
    name: SMTP Password
    description: Password for SMTP authentication.
  smtp_from_email:
    name: SMTP From Address
    description: >-
      Email address that Linkwarden sends from (e.g. linkwarden@example.com).
