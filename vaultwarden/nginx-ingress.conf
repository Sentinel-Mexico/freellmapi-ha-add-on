server {
    listen %%INGRESS_PORT%% default_server;

    allow  172.30.32.2;
    deny   all;

    server_name _;

    client_max_body_size 128M;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Vaultwarden web vault and API
    location / {
        proxy_pass http://127.0.0.1:%%ROCKET_PORT%%;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
        proxy_cache off;
    }

    # Vaultwarden notifications hub (WebSocket)
    location /notifications/hub {
        proxy_pass http://127.0.0.1:%%ROCKET_PORT%%/notifications/hub;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint for nginx itself
    location = /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
