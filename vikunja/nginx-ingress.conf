server {
    listen %%INGRESS_PORT%% default_server;

    allow  172.30.32.2;
    deny   all;

    server_name _;

    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Disable upstream compression so sub_filter can rewrite content.
    proxy_set_header Accept-Encoding "";

    # Vikunja web interface and API
    location / {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
        proxy_cache off;

        sub_filter_once off;
        sub_filter_types text/html;

        # Inject a script that rewrites absolute URLs to relative ones
        # so they route through HA ingress. Also set <base> for HTML attrs.
        sub_filter '</head>' '<script>(function(){var of=window.fetch;window.fetch=function(u,o){if(typeof u==="string"&&u.startsWith("/"))u="."+u;return of.call(this,u,o)};var oo=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(m,u){if(typeof u==="string"&&u.startsWith("/"))u="."+u;return oo.apply(this,arguments)}})();</script><base href="./"></head>';
    }

    # Health check endpoint for nginx itself
    location = /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
