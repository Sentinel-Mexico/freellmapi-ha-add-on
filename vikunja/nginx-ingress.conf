server {
    listen %%INGRESS_PORT%% default_server;

    allow  172.30.32.2;
    deny   all;

    server_name _;

    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Disable upstream compression so sub_filter can inspect/rewrite HTML.
    proxy_set_header Accept-Encoding "";

    location / {
        proxy_pass http://127.0.0.1:%%VIKUNJA_PORT%%;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
        proxy_cache off;

        sub_filter_once off;
        sub_filter_types text/html;

        # Convert absolute asset paths in HTML attributes to relative
        # so they resolve through the ingress base path.
        sub_filter 'src="/' 'src="./';
        sub_filter 'href="/' 'href="./';
        sub_filter "src='/" "src='./";
        sub_filter "href='/" "href='./";

        # Inject: (1) absolute <base> using the ingress path from HA's header
        #         (2) script to fix Vue Router and API calls
        #
        # The script does three things:
        #   a) Strips the ingress prefix from the URL via replaceState so Vue
        #      Router sees "/" and matches its routes.
        #   b) Patches window.fetch to prepend the ingress prefix to absolute
        #      API paths (e.g. /api/v1/...).
        #   c) Patches XMLHttpRequest.open the same way.
        sub_filter '</head>' '<base href="$http_x_ingress_path/"><script>(function(){var m=location.pathname.match(/^(\/api\/hassio_ingress\/[^\/]+)(\/.*)?$/);if(!m)return;var b=m[1],r=m[2]||"/";history.replaceState(history.state,"",r+location.search+location.hash);var F=window.fetch;window.fetch=function(u,i){if(typeof u==="string"&&u.startsWith("/"))u=b+u;return F.call(this,u,i)};var O=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(){var a=Array.prototype.slice.call(arguments);if(typeof a[1]==="string"&&a[1].startsWith("/"))a[1]=b+a[1];return O.apply(this,a)}})();</script></head>';
    }

    location = /nginx-health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
